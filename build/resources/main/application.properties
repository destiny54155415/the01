spring.application.name=Shopping_Project

# ==============================
# Server
# ==============================
server.port=8080

# ==============================
# MySQL Database
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/petshop?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# MyBatis
# ==============================
mybatis.mapper-locations=classpath:/mappers/**/*.xml
mybatis.type-aliases-package=com.shopping_project.dto
mybatis.configuration.map-underscore-to-camel-case=true

# ==============================
# Logging
# ==============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.catshop=DEBUG
```