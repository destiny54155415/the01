; Nebulizer AI firmware — ESP32 reference + host simulation
; Open this folder in Cursor / PlatformIO: File → Open Folder → nebulizer-ai

[platformio]
default_envs = esp32dev
description = AI-enabled nebulizer PCB firmware
src_dir = src
include_dir = include

[common]
build_flags =
  -DNEBULIZER_FW_VERSION=\"1.0.0\"
  -Wall
  -Wextra
  -Iinclude

; ESP32-class reference target (Arduino-compatible HAL)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  ${common.build_flags}
  -DNEBULIZER_BOARD_ESP32=1
  -DNEBULIZER_SIM_CONSOLE=1
build_src_filter =
  +<*>
  -<hal/board_hal_native.cpp>

; Host build: logic + serial/stdin demo without MCU hardware
[env:native]
platform = native
build_flags =
  ${common.build_flags}
  -DNEBULIZER_BOARD_NATIVE=1
  -DNEBULIZER_SIM_CONSOLE=1
  -std=c++17
build_src_filter =
  +<*>
  -<hal/board_hal_esp32.cpp>
