
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 완료 | PetShop</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/order.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>
<nav th:replace="~{fragments/category-nav :: categoryNav}"></nav>

<main class="container page-container">
    <section class="order-complete-container">

        <div class="order-complete-icon">✓</div>

        <h1>주문이 완료되었습니다!</h1>
        <p>PetShop을 이용해 주셔서 감사합니다.</p>

        <div class="order-info">
            <p>
                주문번호 :
                <strong th:text="${order.orderNumber}"></strong>
            </p>

            <p>
                결제 금액 :
                <strong th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + '원'"></strong>
            </p>

            <p>
                받는 사람 :
                <strong th:text="${order.recipient}"></strong>
            </p>

            <p>
                배송 주소 :
                <strong th:text="${order.shippingAddress}"></strong>
            </p>
        </div>

        <div class="order-buttons">
            <a th:href="@{/orders/{orderId}(orderId=${order.orderId})}"
               class="btn btn-primary">
                주문 상세보기
            </a>

            <a th:href="@{/orders}"
               class="btn btn-secondary">
                주문 내역 보기
            </a>

            <a th:href="@{/}"
               class="btn btn-secondary">
                쇼핑 계속하기
            </a>
        </div>

    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
