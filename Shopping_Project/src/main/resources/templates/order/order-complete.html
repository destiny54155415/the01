<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문완료 | Shopping_Project</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<nav th:replace="~{fragments/category-nav :: categoryNav}"></nav>
<main class="page-container">
    <h1 class="section-title">주문이 완료되었습니다</h1>
    <p th:if="${order != null}"
       th:text="'주문번호: ' + ${order.orderId != null ? order.orderId : order.id}">주문번호</p>
    <a class="btn" th:href="@{/orders}">주문내역 보기</a>
    <a class="btn btn-primary" th:href="@{/}">홈으로</a>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
