<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문내역 | Shopping_Project</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<nav th:replace="~{fragments/category-nav :: categoryNav}"></nav>

<main class="page-container">
    <h1 class="section-title">주문내역</h1>

    <p class="notice" th:if="${message}" th:text="${message}">알림</p>

    <div class="empty-state" th:if="${orders == null or #lists.isEmpty(orders)}">
        <p>주문 내역이 없습니다.</p>
        <a class="btn btn-primary" th:href="@{/}">쇼핑 계속하기</a>
    </div>

    <table class="admin-table" th:if="${orders != null and !#lists.isEmpty(orders)}">
        <thead>
        <tr>
            <th>주문번호</th>
            <th>상태</th>
            <th>상세</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.id}">1</td>
            <td th:text="${order.status}">ORDERED</td>
            <td><a th:href="@{/orders/{id}(id=${order.id})}">보기</a></td>
        </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
