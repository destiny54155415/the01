<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문내역 | Shopping_Project</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<nav th:replace="~{fragments/category-nav :: categoryNav}"></nav>
<main class="page-container">
    <h1 class="section-title">주문내역</h1>
    <p th:if="${orders == null or #lists.isEmpty(orders)}" class="notice">주문내역이 없습니다.</p>
    <table th:if="${orders != null and !#lists.isEmpty(orders)}" class="admin-table">
        <thead>
        <tr>
            <th>주문번호</th>
            <th>상태</th>
            <th>금액</th>
            <th>상세</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td>
                <span th:if="${order.orderId != null}" th:text="${order.orderId}">1</span>
                <span th:unless="${order.orderId != null}" th:text="${order.id}">1</span>
            </td>
            <td>
                <span th:if="${order.status != null}" th:text="${order.status}">상태</span>
                <span th:unless="${order.status != null}" th:text="${order.orderStatus}">상태</span>
            </td>
            <td>
                <span th:if="${order.totalPrice != null}" th:text="${order.totalPrice}">0</span>
                <span th:unless="${order.totalPrice != null}" th:text="${order.totalAmount}">0</span>
            </td>
            <td>
                <a class="btn"
                   th:href="@{/orders/{orderId}(orderId=${order.orderId != null ? order.orderId : order.id})}">보기</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
