<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문상세 | Shopping_Project</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<nav th:replace="~{fragments/category-nav :: categoryNav}"></nav>
<main class="page-container">
    <h1 class="section-title">주문 상세</h1>
    <div th:if="${order != null}">
        <p th:text="'주문번호: ' + ${order.orderId != null ? order.orderId : order.id}">주문번호</p>
        <p th:text="'상태: ' + ${order.status != null ? order.status : order.orderStatus}">상태</p>
        <ul>
            <li th:each="item : ${order.orderItems}"
                th:text="${item.productName != null ? item.productName : item.productId} + ' x ' + ${item.quantity}">item</li>
        </ul>
        <form th:action="@{/orders/{orderId}/cancel(orderId=${order.orderId != null ? order.orderId : order.id})}" method="post">
            <button class="btn" type="submit">주문 취소</button>
        </form>
    </div>
    <a class="btn" th:href="@{/orders}">목록으로</a>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
