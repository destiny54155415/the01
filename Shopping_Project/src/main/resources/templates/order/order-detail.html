
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 상세 | PetShop</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/order.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>
<nav th:replace="~{fragments/category-nav :: categoryNav}"></nav>

<main class="container page-container">
    <section class="order-detail-container">

        <h1>주문 상세 정보</h1>
        <p class="text-muted">주문하신 상품과 배송 정보를 확인할 수 있습니다.</p>

        <p th:if="${message}"
           th:text="${message}"
           style="color: green;">
        </p>

        <p th:if="${errorMessage}"
           th:text="${errorMessage}"
           style="color: red;">
        </p>

        <!-- 주문 기본 정보 -->
        <div class="order-detail-card">

            <h2>주문 정보</h2>

            <div class="detail-info-row">
                <span>주문번호</span>
                <strong th:text="${order.orderNumber}"></strong>
            </div>

            <div class="detail-info-row">
                <span>주문일자</span>
                <strong th:text="${#temporals.format(order.orderedAt, 'yyyy-MM-dd HH:mm')}"></strong>
            </div>

            <div class="detail-info-row">
                <span>주문 상태</span>
                <strong th:switch="${order.orderStatus}">
                    <span th:case="ORDERED">주문 완료</span>
                    <span th:case="PREPARING">상품 준비 중</span>
                    <span th:case="SHIPPING">배송 중</span>
                    <span th:case="COMPLETED">배송 완료</span>
                    <span th:case="CANCELLED">주문 취소</span>
                    <span th:case="*">확인 필요</span>
                    <div th:if="${order.orderStatus.name() == 'CANCELLED'}"
                         class="order-cancel-notice">
                        <strong>주문이 취소되었습니다.</strong>
                    </div>
                </strong>

            </div>

        </div>

        <!-- 주문 상품 -->
        <div class="order-detail-card">

            <h2>주문 상품</h2>

            <div class="detail-product"
                 th:each="item : ${order.orderItems}">

                <div>
                    <strong th:text="${item.productName}"></strong>

                    <p>
                        <span th:text="${item.quantity}"></span>개
                        ×
                        <span th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')}"></span>원
                    </p>
                </div>

                <div>
                    <strong th:text="${#numbers.formatDecimal(item.totalPrice, 0, 'COMMA', 0, 'POINT')} + '원'"></strong>

                    <!-- 리뷰 작성 버튼 -->
                    <div th:if="${order.orderStatus.name() == 'COMPLETED'
                         and !reviewedProductIds.contains(item.productId)}">

                        <a th:href="@{/reviews/product/{productId}(productId=${item.productId}, orderItemId=${item.orderItemId})}"
                           class="btn-review">
                            리뷰 작성
                        </a>

                    </div>

                    <!-- 이미 리뷰 작성한 경우 -->
                    <div th:if="${reviewedProductIds.contains(item.productId)}">
                        <span>리뷰 작성 완료</span>
                    </div>

                </div>

            </div>

        </div>

        <!-- 배송 정보 -->
        <div class="order-detail-card">

            <h2>배송 정보</h2>

            <div class="detail-info-row">
                <span>받는 사람</span>
                <strong th:text="${order.recipient}"></strong>
            </div>

            <div class="detail-info-row">
                <span>배송 주소</span>
                <strong th:text="${order.shippingAddress}"></strong>
            </div>

        </div>

        <!-- 결제 금액 -->
        <div class="order-detail-card payment-card">

            <h2>결제 금액</h2>

            <div class="detail-info-row">
                <span>총 상품 금액</span>
                <strong th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + '원'"></strong>
            </div>

            <div class="detail-info-row total-row">
                <span>최종 결제 금액</span>
                <strong th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + '원'"></strong>
            </div>

        </div>

        <div class="order-detail-buttons">

            <!-- 주문 취소 -->
            <form th:if="${order.orderStatus.name() == 'ORDERED'}"
                  th:action="@{/orders/{orderId}/cancel(orderId=${order.orderId})}"
                  method="post"
                  onsubmit="return confirm('정말 주문을 취소하시겠습니까?');">

                <button type="submit" class="order-back-btn">
                    주문 취소
                </button>

            </form>

            <a th:href="@{/orders}" class="order-back-btn">
                주문 내역으로
            </a>

            <a th:href="@{/products}" class="order-back-btn">
                쇼핑 계속하기
            </a>

        </div>

    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
