<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | Shopping_Project</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<nav th:replace="~{fragments/category-nav :: categoryNav}"></nav>
<main class="page-container">
    <div class="auth-container">
        <h1 class="auth-title">로그인</h1>

        <p th:if="${successMessage}" class="form-success" th:text="${successMessage}">가입 완료</p>
        <p th:if="${errorMessage != null}" class="form-error" th:text="${errorMessage}">로그인 오류</p>
        <p th:if="${errorMessage == null and error != null}" class="form-error" th:text="${error}">로그인 오류</p>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label class="form-label" for="username">아이디</label>
                <input id="username" name="username" type="text" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">비밀번호</label>
                <input id="password" name="password" type="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">로그인</button>
        </form>

        <div class="auth-links">
            <a th:href="@{/signup}">회원가입</a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
