<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop | 회원 정보 조회</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>

<body>

<!-- 공통 헤더 -->
<header th:replace="~{fragments/header :: header}"></header>

<!-- 메인 콘텐츠 -->
<main class="page-container">

    <div style="display: flex; max-width: 1200px; margin: 0 auto; gap: 30px; align-items: flex-start;">

        <!-- 왼쪽 공통 사이드바 -->
        <div th:replace="~{fragments/mypage-sidebar :: sidebar}"></div>

        <!-- 오른쪽 회원 정보 영역 -->
        <div style="flex-grow: 1; background: #fff; padding: 40px; border: 1px solid #eee; border-radius: 8px;">

            <h1 class="section-title" style="font-size: 24px; margin-bottom: 25px;">
                회원 정보 조회
            </h1>

            <p style="color: #777; font-size: 14px; margin-bottom: 25px;">
                회원님의 기본 정보를 확인할 수 있습니다.
            </p>

            <!-- 회원 정보 테이블 -->
            <table class="table" style="text-align: left;">
                <tr>
                    <th style="width: 25%;">아이디</th>
                    <td th:text="${member.username}">아이디</td>
                </tr>
                <tr>
                    <th>이름</th>
                    <td th:text="${member.name}">이름</td>
                </tr>
                <tr>
                    <th>이메일</th>
                    <td th:text="${member.email}">이메일</td>
                </tr>
                <tr>
                    <th>전화번호</th>
                    <td th:text="${member.phone}">전화번호</td>
                </tr>
            </table>

            <!-- 회원 정보 수정 버튼 -->
            <div style="text-align: right; margin-top: 25px;">
                <a th:href="@{/mypage/edit}" class="btn btn-primary" style="padding: 10px 20px;">
                    회원 정보 수정
                </a>
            </div>

        </div>
    </div>

</main>

<!-- 공통 푸터 -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
