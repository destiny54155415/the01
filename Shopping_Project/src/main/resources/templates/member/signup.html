<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop | 회원가입</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>

<body>
<!-- 공통 헤더 -->
<header th:replace="~{fragments/header :: header}"></header>

<!-- 메인 콘텐츠 -->
<main class="page-container">
    <div class="auth-container">
        <h1 class="auth-title">회원가입</h1>

        <form th:action="@{/signup}" method="post">

            <!-- 아이디 -->
            <div class="form-group">
                <label for="username" class="form-label">아이디</label>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="username" name="username" class="form-control" placeholder="아이디를 입력하세요"
                           required>
                    <button type="button" id="checkIdBtn" class="btn"
                            style="white-space: nowrap; padding: 0 15px; background-color: #4b5563; color: white; border: none; border-radius: 4px; cursor: pointer;">
                        중복확인
                    </button>
                </div>

                <div id="checkIdMessage" style="font-size: 13px; margin-top: 6px; font-weight: 600;"></div>
            </div>

            <!-- 비밀번호 -->
            <div class="form-group">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="비밀번호를 입력하세요"
                       required>
                <div id="passwordLengthMessage" style="font-size:13px; margin-top:6px; font-weight:600;"></div>
            </div>

            <!-- 비밀번호 확인 -->
            <div class="form-group">
                <label for="passwordConfirm" class="form-label">비밀번호 재입력</label>
                <input type="password" id="passwordConfirm" class="form-control" placeholder="비밀번호를 다시 입력하세요" required>
                <div id="passwordMatchMessage" style="font-size:13px; margin-top:6px; font-weight:600;"></div>
            </div>

            <!-- 이름 -->
            <div class="form-group">
                <label for="name" class="form-label">이름</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="이름을 입력하세요" required>
            </div>

            <!-- 이메일 -->
            <div class="form-group">
                <label for="email" class="form-label">이메일</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="이메일을 입력하세요" required>
            </div>

            <!-- 전화번호 -->
            <div class="form-group">
                <label for="phone" class="form-label">휴대폰 번호</label>
                <input type="text" id="phone" name="phone" class="form-control" placeholder="휴대폰 번호를 입력하세요" required>
            </div>

            <!-- 회원가입 버튼 -->
            <button type="submit" class="btn btn-primary btn-block">가입하기</button>

        </form>

        <!-- 로그인 페이지 이동 -->
        <div class="auth-links">
            <a th:href="@{/login}">로그인으로 돌아가기</a>
        </div>

    </div>
</main>

<!-- 공통 푸터 -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<script>
    // 중복확인 버튼을 클릭했을 때 실행되는 기능
    document.getElementById("checkIdBtn").addEventListener("click", function() {
        const username = document.getElementById("username").value;
        const messageDiv = document.getElementById("checkIdMessage");

        if(username === "") {
            alert("아이디를 입력해주세요!");
            return;
        }

        fetch("/members/check-id?username=" + username)
            .then(function(response) {
                return response.json(); // 결과를 JSON 형태로 바꿉니다.
            })
            .then(function(isDuplicate) {
                // isDuplicate가 true면 중복(이미 있음), false면 사용 가능
                if(isDuplicate) {
                    messageDiv.style.color = "red";
                    messageDiv.textContent = "이미 사용 중인 아이디입니다.";
                } else {
                    messageDiv.style.color = "green";
                    messageDiv.textContent = "사용 가능한 아이디입니다.";
                }
            })
            .catch(function(error) {
                console.log("에러 발생: ", error);
            });
    });

    // 비밀번호 길이 및 일치 검사 기능
    const passwordInput = document.getElementById("password");
    const passwordConfirmInput = document.getElementById("passwordConfirm");
    const passwordLengthMessage = document.getElementById("passwordLengthMessage");
    const passwordMatchMessage = document.getElementById("passwordMatchMessage");

    function checkPassword() {
        const password = passwordInput.value;
        const passwordConfirm = passwordConfirmInput.value;

        if(passwordConfirm === "") {
            passwordLengthMessage.textContent = "";
            passwordMatchMessage.textContent = "";
            return;
        }

        if(password.length < 8) {
            passwordLengthMessage.style.color = "red";
            passwordLengthMessage.textContent = "안전한 사용을 위해 8자 이상 입력해주세요";
        } else {
            passwordLengthMessage.style.color = "green";
            passwordLengthMessage.textContent = "사용 가능한 길이의 비밀번호입니다.";
        }

        if(passwordConfirm === "") {
            passwordMatchMessage.textContent = "";
            return;
        }

        if(password === passwordConfirm) {
            passwordMatchMessage.style.color = "green";
            passwordMatchMessage.textContent = "비밀번호가 일치합니다.";
        } else {
            passwordMatchMessage.style.color = "red";
            passwordMatchMessage.textContent = "비밀번호가 일치하지 않습니다.";
        }
    }

    passwordInput.addEventListener("keyup", checkPassword);
    passwordConfirmInput.addEventListener("keyup", checkPassword);
</script>

</body>
</html>
