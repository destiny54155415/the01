<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${form.productId == null} ? '상품 등록' : '상품 수정'">상품 편집</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>

<body>

<!-- 공통 헤더 -->
<header th:replace="~{fragments/header :: header}"></header>

<!-- 공통 카테고리 -->
<nav th:replace="~{fragments/category-nav :: categoryNav}"></nav>

<main class="page-container narrow">
    <h1 class="section-title" th:text="${form.productId == null} ? '상품 등록' : '상품 수정'">상품 등록</h1>

    <form class="admin-form" th:object="${form}"
          th:action="${form.productId == null} ? @{/admin/products} : @{/admin/products/{id}(id=${form.productId})}"
          method="post">
        <div class="form-group">
            <label class="form-label">상품카테고리</label>
            <p class="text-muted">등록할 상품의 카테고리를 선택하세요.</p>

            <div class="category-chip-list" role="radiogroup" aria-label="상품카테고리">
                <label class="category-chip"
                       th:each="category : ${adminCategories}"
                       th:for="${'categoryChip-' + category.categoryId}">
                    <input type="radio"
                           th:id="${'categoryChip-' + category.categoryId}"
                           th:field="*{categoryId}"
                           th:value="${category.categoryId}"
                           required>
                    <span th:text="${category.categoryName}">사료</span>
                </label>
            </div>
            <p class="field-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></p>
            <p class="text-muted"
               th:if="${adminCategories == null or #lists.isEmpty(adminCategories)}">
                등록된 카테고리가 없습니다. 앱을 재시작하면 기본 카테고리가 생성됩니다.
            </p>
        </div>

        <div class="form-group">
            <label class="form-label" for="productName">상품명</label>
            <input id="productName" type="text" class="form-control" th:field="*{productName}" required>
            <p class="field-error" th:if="${#fields.hasErrors('productName')}" th:errors="*{productName}"></p>
        </div>

        <div class="form-group">
            <label class="form-label" for="description">상품 설명</label>
            <textarea id="description" class="form-control" rows="5" th:field="*{description}"></textarea>
        </div>

        <div class="form-group">
            <label class="form-label" for="price">가격</label>
            <input id="price" type="number" min="0" step="100" class="form-control" th:field="*{price}" required>
            <p class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
        </div>

        <div class="form-group">
            <label class="form-label" for="stock">재고</label>
            <input id="stock" type="number" min="0" class="form-control" th:field="*{stock}" required>
            <p class="field-error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></p>
        </div>

        <div class="form-group">
            <label class="form-label" for="salesCount">누적 판매량</label>
            <input id="salesCount" type="number" min="0" class="form-control" th:field="*{salesCount}" required>
            <p class="text-muted">인기/추천 정렬에 사용됩니다.</p>
            <p class="field-error" th:if="${#fields.hasErrors('salesCount')}" th:errors="*{salesCount}"></p>
        </div>

        <div class="form-group">
            <label class="form-label" for="petType">반려동물 구분</label>
            <select id="petType" class="form-control" th:field="*{petType}">
                <option th:each="type : ${petTypes}" th:value="${type}" th:text="${type.label}">공용</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label" for="imageUrl">대표 이미지 URL</label>
            <input id="imageUrl" type="text" class="form-control" th:field="*{imageUrl}"
                   placeholder="/images/food-cat.jpg">
        </div>
        <div class="form-group">
            <label class="form-label" for="imageUrl2">박스 형태 이미지 URL</label>
            <input id="imageUrl2" type="text" class="form-control" th:field="*{imageUrl2}"
                   placeholder="/images/gallery/food-box.jpg">
        </div>
        <div class="form-group">
            <label class="form-label" for="imageUrl3">제품 분리/구성 이미지 URL</label>
            <input id="imageUrl3" type="text" class="form-control" th:field="*{imageUrl3}"
                   placeholder="/images/gallery/food-open.jpg">
        </div>

        <div class="form-group check-row">
            <label>
                <input type="checkbox" th:field="*{isActive}"> 판매중으로 표시
            </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block">저장</button>
        <a class="btn btn-outline btn-block" th:href="@{/admin/products}">목록으로</a>
    </form>
</main>

<!-- 공통 푸터 -->
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/product.js}"></script>
</body>
</html>
