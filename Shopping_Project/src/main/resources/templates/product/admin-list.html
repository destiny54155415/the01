<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>상품 관리 | PetShop</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>

<body>

<!-- 공통 헤더 -->
<header th:replace="~{fragments/header :: header}"></header>

<!-- 공통 카테고리 -->
<nav th:replace="~{fragments/category-nav :: categoryNav}"></nav>

<main class="page-container">
    <div class="product-list-head">
        <h1 class="section-title">관리자 상품 관리</h1>
        <a class="btn btn-primary" th:href="@{/admin/products/new}">상품 등록</a>
    </div>

    <p class="notice" th:if="${message}" th:text="${message}">알림</p>

    <form class="product-filter" method="get" th:action="@{/admin/products}">
        <input type="search" name="keyword" class="form-control" th:value="${keyword}" placeholder="상품명 검색">
        <select name="categoryId" class="form-control">
            <option value="">전체 카테고리</option>
            <option th:each="category : ${adminCategories}"
                    th:value="${category.categoryId}"
                    th:text="${category.categoryName}"
                    th:selected="${categoryId == category.categoryId}"></option>
        </select>
        <select name="petType" class="form-control">
            <option value="">전체 동물</option>
            <option th:each="type : ${petTypes}"
                    th:value="${type}"
                    th:text="${type.label}"
                    th:selected="${petType == type}"></option>
        </select>
        <button type="submit" class="btn btn-secondary">찾기</button>
    </form>

    <div class="table-wrap">
        <table class="admin-table">
            <thead>
            <tr>
                <th>상품</th>
                <th>카테고리</th>
                <th>가격</th>
                <th>재고</th>
                <th>판매량</th>
                <th>구분</th>
                <th>상태</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${result.content}">
                <td th:text="${product.productName}">상품명</td>
                <td th:text="${product.category.categoryName}">카테고리</td>
                <td th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + '원'">0원</td>
                <td th:text="${product.stock}">0</td>
                <td th:text="${product.salesCount}">0</td>
                <td th:text="${product.petType.label}">공용</td>
                <td th:text="${product.isActive} ? '판매중' : '비활성'">판매중</td>
                <td class="admin-actions">
                    <a th:href="@{/admin/products/{id}/edit(id=${product.productId})}">수정</a>
                    <form th:action="@{/admin/products/{id}/deactivate(id=${product.productId})}" method="post">
                        <button type="submit">비활성</button>
                    </form>
                    <form th:action="@{/admin/products/{id}/delete(id=${product.productId})}" method="post"
                          onsubmit="return confirm('정말 삭제할까요?');">
                        <button type="submit" class="danger">삭제</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <p class="empty-state" th:if="${result.totalElements == 0}">등록된 상품이 없습니다.</p>

    <nav class="pager" th:if="${result.totalPages > 1}">
        <a th:if="${result.hasPrevious()}"
           class="btn btn-outline"
           th:href="@{/admin/products(keyword=${keyword}, categoryId=${categoryId}, petType=${petType}, page=${result.number - 1})}">이전</a>
        <span th:text="|${result.number + 1} / ${result.totalPages}|">1 / 1</span>
        <a th:if="${result.hasNext()}"
           class="btn btn-outline"
           th:href="@{/admin/products(keyword=${keyword}, categoryId=${categoryId}, petType=${petType}, page=${result.number + 1})}">다음</a>
    </nav>
</main>

<!-- 공통 푸터 -->
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/product.js}"></script>
</body>
</html>
