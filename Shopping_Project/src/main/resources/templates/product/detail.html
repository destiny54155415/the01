<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${product.productName} + ' | PetShop'">상품 상세</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>

<body>

<!-- 공통 헤더 -->
<header th:replace="~{fragments/header :: header}"></header>

<!-- 공통 카테고리 -->
<nav th:replace="~{fragments/category-nav :: categoryNav}"></nav>

<main class="page-container">
    <p class="crumb">
        <a th:href="@{/}">전체상품</a>
        <span>/</span>
        <a th:href="@{/(categoryId=${product.category.categoryId})}"
           th:text="${product.category.categoryName}">카테고리</a>
    </p>

    <section class="product-detail">
        <img class="product-detail-image"
             th:src="@{${product.imageUrl != null and !#strings.isEmpty(product.imageUrl) ? product.imageUrl : '/images/sample.jpg'}}"
             th:alt="${product.productName}">

        <div class="product-detail-info">
            <p class="product-category" th:text="${product.category.categoryName}">사료</p>
            <h1 th:text="${product.productName}">상품명</h1>
            <p class="product-price">
                <span th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + '원'">0원</span>
            </p>
            <p class="text-muted" th:text="|구분: ${product.petType.label}|">구분</p>
            <p class="text-muted" th:text="|재고: ${product.stock}개|">재고</p>
            <p class="product-summary"
               th:text="${product.description != null ? #strings.substringBefore(product.description, '【').trim() : ''}">요약</p>

            <div class="product-actions">
                <a class="btn btn-primary" th:href="@{/cart}">장바구니로 이동</a>
                <a class="btn btn-outline" th:href="@{/(categoryId=${product.category.categoryId})}">같은 카테고리 보기</a>
            </div>
            <p class="text-muted">장바구니 담기는 3번 담당, 리뷰는 4번 담당 기능입니다.</p>
        </div>
    </section>

    <!-- 이미지 하단 상세 페이지 -->
    <section class="product-detail-body" th:if="${product.description != null and !#strings.isEmpty(product.description)}">
        <h2 class="product-detail-title">상품 상세 정보</h2>
        <div class="product-detail-content" th:text="${product.description}">상세 설명</div>

        <div class="product-detail-meta">
            <h3>기본 정보</h3>
            <ul>
                <li th:text="|상품명: ${product.productName}|">상품명</li>
                <li th:text="|카테고리: ${product.category.categoryName}|">카테고리</li>
                <li th:text="|반려동물 구분: ${product.petType.label}|">구분</li>
                <li th:text="|판매가: ${#numbers.formatInteger(product.price, 0, 'COMMA')}원|">가격</li>
                <li th:text="|재고: ${product.stock}개|">재고</li>
            </ul>
        </div>
    </section>
</main>

<!-- 공통 푸터 -->
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/product.js}"></script>
</body>
</html>
