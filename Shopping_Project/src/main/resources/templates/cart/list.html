<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장바구니 | Shopping_Project</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<nav th:replace="~{fragments/category-nav :: categoryNav}"></nav>
<main class="page-container">
    <h1 class="section-title">장바구니</h1>
    <p th:if="${cartItems == null or #lists.isEmpty(cartItems)}" class="notice">장바구니가 비어 있습니다.</p>
    <table th:if="${cartItems != null and !#lists.isEmpty(cartItems)}" class="admin-table">
        <thead>
        <tr><th>상품</th><th>수량</th><th>관리</th></tr>
        </thead>
        <tbody>
        <tr th:each="item : ${cartItems}">
            <td th:text="${item.product != null ? item.product.productName : item.id}">상품</td>
            <td>
                <form th:action="@{/cart/update/{id}(id=${item.id})}" method="post" style="display:inline-flex;gap:8px;">
                    <input class="form-control" style="width:80px;" type="number" name="quantity" min="1" th:value="${item.quantity}">
                    <button class="btn" type="submit">변경</button>
                </form>
            </td>
            <td>
                <form th:action="@{/cart/delete/{id}(id=${item.id})}" method="post">
                    <button class="btn" type="submit">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p style="margin-top:16px;">
        <a class="btn" th:href="@{/}">쇼핑 계속하기</a>
    </p>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
