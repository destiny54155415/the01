<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>마이페이지 - 찜한 상품</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<style>
		/* 위시리스트 카드 레이아웃 */
		.wishlist-card {
			position: relative;
			padding: 20px;
			margin-bottom: 15px;
			border: 1px solid #eee;
			border-radius: 8px;
			background-color: #fff;
			transition: all 0.2s ease-in-out;
		}
		.wishlist-card:hover {
			box-shadow: 0 4px 15px rgba(0,0,0,0.05);
		}
		.product-img {
			width: 90px;
			height: 90px;
			object-fit: cover;
			background-color: #f5f5f5;
			border-radius: 6px;
		}
		.wishlist-price {
			font-size: 18px;
			font-weight: 700;
		}
		/* 우측 상단 X 삭제 버튼 스타일 */
		.delete-x-btn {
			position: absolute;
			top: 15px;
			right: 20px;
			background: none;
			border: none;
			font-size: 20px;
			color: #bbb;
			cursor: pointer;
			transition: color 0.2s;
			z-index: 10;
		}
		.delete-x-btn:hover {
			color: #dc3545;
		}
		/* 아담한 수량 조절 박스 디자인 */
		.qty-box {
			display: flex;
			align-items: center;
			border: 1px solid #ced4da;
			border-radius: 4px;
			overflow: hidden;
			background: #fff;
			width: 100px;
			height: 32px;
		}
		.qty-box button {
			background: #f8f9fa;
			border: none;
			width: 30px;
			height: 100%;
			font-size: 14px;
			cursor: pointer;
			color: #333;
		}
		.qty-box button:hover {
			background: #e2e6ea;
		}
		.qty-box input {
			width: 40px;
			height: 100%;
			border: none;
			text-align: center;
			font-size: 13px;
			outline: none;
		}
		/* 토스트 알림 메시지 스타일 */
		#toast-message {
			position: fixed;
			top: 20px;
			left: 50%;
			transform: translateX(-50%);
			background-color: rgba(0, 0, 0, 0.8);
			color: white;
			padding: 12px 24px;
			border-radius: 30px;
			font-size: 14px;
			z-index: 1000;
			display: none;
			box-shadow: 0 4px 10px rgba(0,0,0,0.2);
		}
	</style>
</head>
<body>

<!-- 화면 상단 토스트 알림 영역 -->
<div id="toast-message">장바구니에 담겼습니다.</div>

<!-- 1. 공통 헤더 Fragment 삽입 -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- 2. 메인 컨텐츠 영역 (마이페이지 표준 flex 레이아웃) -->
<main class="page-container">
	<div style="display: flex; max-width: 1200px; margin: 0 auto; gap: 30px; align-items: flex-start;">
		
		<!-- 왼쪽 사이드바 메뉴 -->
		<!-- 왼쪽 공통 사이드바 -->
		<div th:replace="~{fragments/mypage-sidebar :: sidebar}"></div>
		
		<!-- 오른쪽 본문 영역 -->
		<div style="flex-grow: 1; background: #fff; padding: 40px; border: 1px solid #eee; border-radius: 8px;">
			
			<div class="d-flex justify-content-between align-items-center mb-4">
				<h3 style="margin: 0; font-size: 18px; color: #333;">❤️ 찜 리스트</h3>
			</div>
			
			<!-- 찜한 상품이 없을 경우 -->
			<div th:if="${wishlists == null or #lists.isEmpty(wishlists)}" class="text-center py-5 border rounded bg-white">
				<p class="text-muted fs-5 mb-3">찜한 상품이 없습니다. 마음에 드는 상품을 찜해보세요!</p>
				<br>
				<a href="/" class="btn btn-primary">쇼핑하러 가기</a>
			</div>
			
			<!-- 찜한 상품이 있을 경우 리스트 출력 -->
			<div th:if="${wishlists != null and not #lists.isEmpty(wishlists)}">
				<div th:each="wishlist : ${wishlists}">
					<div class="wishlist-card">
						
						<!-- 우측 상단 X 삭제 버튼 -->
						<form th:action="@{/wishlist/delete/{id}(id=${wishlist.id})}" method="post"
							  onsubmit="return confirm('정말로 삭제하시겠습니까?');">
							<button type="submit" class="delete-x-btn" title="삭제">&times;</button>
						</form>
						
						<!-- 3개의 칸(열) 레이아웃 구조 -->
						<div style="display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-right: 35px;" th:if="${wishlist.product != null}">
							
							<!-- [1번 칸] 왼쪽: 상품 사진 -->
							<div style="flex-shrink: 0;">
								<img th:src="${wishlist.product?.imageUrl != null and wishlist.product?.imageUrl != '' ? wishlist.product.imageUrl : '/images/default-product.png'}"
									 class="product-img" alt="상품 이미지">
							</div>
							
							<!-- [2번 칸] 가운데: 상품 설명 및 재고 -->
							<div style="flex-grow: 1;">
								<h5 class="mb-1 fw-semibold" style="font-size: 16px;" th:text="${wishlist.product?.productName != null ? wishlist.product.productName : '삭제된 상품입니다'}">상품 이름</h5>
								<p class="wishlist-price text-danger mb-1"
								   th:text="${wishlist.product?.price != null ? #numbers.formatInteger(wishlist.product.price, 3, 'COMMA') + '원' : '0원'}">0원</p>
								<p class="text-muted mb-0" style="font-size: 13px;"
								   th:text="${wishlist.product?.stock != null ? '재고: ' + wishlist.product.stock + '개' : '재고 정보 없음'}">재고: 0개</p>
							</div>
							
							<!-- [3번 칸] 오른쪽: 수량 조절 박스 + 장바구니 담기 버튼 -->
							<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0;">
								
								<!-- 수량 직접 입력 및 조절 박스 (- 1 +) -->
								<div class="qty-box">
									<button type="button" th:onclick="|decreaseQty(${wishlist.id})|">-</button>
									<input type="number" th:id="'quantity-' + ${wishlist.id}" value="1" min="1"
										   th:max="${wishlist.product?.stock != null ? wishlist.product.stock : 99}"
										   th:onchange="|validateQty(${wishlist.id}, ${wishlist.product?.stock})|">
									<button type="button" th:onclick="|increaseQty(${wishlist.id}, ${wishlist.product?.stock})|">+</button>
								</div>
								
								<!-- 💡 장바구니 담기 버튼 복구 완료 -->
								<button type="button" class="btn btn-primary btn-sm text-nowrap" style="width: 100px; font-size: 13px; padding: 5px 10px;"
										th:onclick="|addCartFromWish(${wishlist.product.productId}, ${wishlist.id})|">
									장바구니 담기
								</button>
							
							</div>
						
						</div>
						
						<!-- 상품이 삭제된 경우의 대체 표시 -->
						<div th:if="${wishlist.product == null}" class="py-2">
							<span class="text-muted fs-6">판매가 종료된 상품입니다.</span>
						</div>
					
					</div>
				</div>
			</div>
		
		</div>
	</div>
</main>

<!-- 3. 공통 푸터 Fragment 삽입 -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- AJAX 및 수량 직접 입력/조절 자바스크립트 -->
<script th:inline="javascript">
	// 수량 감소
	function decreaseQty(wishlistId) {
		const input = document.getElementById('quantity-' + wishlistId);
		let val = parseInt(input.value) || 1;
		if (val > 1) {
			input.value = val - 1;
		}
	}
	
	// 수량 증가 (재고 초과 방지)
	function increaseQty(wishlistId, maxStock) {
		const input = document.getElementById('quantity-' + wishlistId);
		let val = parseInt(input.value) || 1;
		if (maxStock && val >= maxStock) {
			alert('재고 수량을 초과할 수 없습니다.');
			return;
		}
		input.value = val + 1;
	}
	
	// 직접 입력했을 때 유효성 검사 (최소 1개, 최대 재고 수량 제한)
	function validateQty(wishlistId, maxStock) {
		const input = document.getElementById('quantity-' + wishlistId);
		let val = parseInt(input.value);
		
		if (isNaN(val) || val < 1) {
			input.value = 1;
			return;
		}
		if (maxStock && val > maxStock) {
			alert('재고 수량을 초과할 수 없습니다.');
			input.value = maxStock;
		}
	}
	
	// 장바구니 담기 (선택한 수량 반영)
	function addCartFromWish(productId, wishlistId) {
		const qtyInput = document.getElementById('quantity-' + wishlistId);
		let quantity = qtyInput ? parseInt(qtyInput.value) : 1;
		
		if (isNaN(quantity) || quantity < 1) {
			quantity = 1;
			qtyInput.value = 1;
		}
		
		const formData = new FormData();
		formData.append('productId', productId);
		formData.append('quantity', quantity);
		
		fetch('/cart/add', {
			method: 'POST',
			body: formData
		})
				.then(response => {
					if (response.status === 401) {
						alert('로그인이 필요한 서비스입니다.');
						location.href = '/member/login';
						return;
					}
					if (response.ok) {
						return response.text();
					}
					throw new Error('장바구니 담기 실패');
				})
				.then(data => {
					if (data !== undefined) {
						showToast("장바구니에 담겼습니다.");
					}
				})
				.catch(error => {
					console.error('Error:', error);
					alert('장바구니 담기 중 오류가 발생했습니다.');
				});
	}
	
	function showToast(message) {
		const toast = document.getElementById('toast-message');
		toast.innerText = message;
		toast.style.display = 'block';
		
		setTimeout(() => {
			toast.style.display = 'none';
		}, 2000);
	}
</script>
</body>
</html>
