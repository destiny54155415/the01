
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>관리자 주문 관리 | PetShop</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">

    <style>
        .admin-order-container {
            width: 1100px;
            max-width: 95%;
            margin: 60px auto;
        }

        .admin-order-container h2 {
            margin-bottom: 25px;
        }

        /* 대시보드 통계 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 35px;
        }

        .dashboard-card {
            padding: 23px 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fff;
        }

        .dashboard-card h3 {
            margin: 0 0 15px;
            color: #777;
            font-size: 15px;
        }

        .dashboard-card p {
            margin: 0;
            font-size: 25px;
            font-weight: bold;
            color: #333;
        }

        .order-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        .order-table th,
        .order-table td {
            padding: 15px 10px;
            border-bottom: 1px solid #ddd;
        }

        .order-table th {
            background: #f5f5f5;
        }

        .order-status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .ordered {
            background: #e6f4ff;
            color: #1677c8;
        }

        .preparing {
            background: #fff7e6;
            color: #d48806;
        }

        .shipping {
            background: #f0eaff;
            color: #722ed1;
        }

        .completed {
            background: #e6f7ed;
            color: #389e5d;
        }

        .cancelled {
            background: #fff1f0;
            color: #cf1322;
        }

        .empty-message {
            padding: 50px;
            text-align: center;
            color: #888;
        }

        @media (max-width: 750px) {
            .dashboard-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<header th:replace="~{fragments/header :: header}"></header>
<nav th:replace="~{fragments/category-nav :: categoryNav}"></nav>

<main class="admin-order-container">

    <h2>주문 관리</h2>

    <!-- 관리자 대시보드 통계 -->
    <div class="dashboard-grid">

        <div class="dashboard-card">
            <h3>전체 주문</h3>
            <p>
                <span th:text="${totalOrderCount}">0</span>건
            </p>
        </div>

        <div class="dashboard-card">
            <h3>오늘 주문</h3>
            <p>
                <span th:text="${todayOrderCount}">0</span>건
            </p>
        </div>

        <div class="dashboard-card">
            <h3>취소 제외 총 매출</h3>
            <p>
                <span th:text="${#numbers.formatDecimal(totalSales, 0, 'COMMA', 0, 'POINT')}">0</span>원
            </p>
        </div>

        <div class="dashboard-card">
            <h3>배송 처리 전</h3>
            <p>
                <span th:text="${pendingDeliveryCount}">0</span>건
            </p>
        </div>

    </div>

    <!-- 주문 검색 및 필터 -->
    <form th:action="@{/admin/orders}" method="get"
          style="margin-bottom: 25px;">

        <select name="status" style="padding: 10px;">
            <option value="">전체 주문</option>

            <option th:each="status : ${statuses}"
                    th:value="${status}"
                    th:text="${status.name() == 'ORDERED' ? '주문 접수' :
                          status.name() == 'PREPARING' ? '상품 준비 중' :
                          status.name() == 'SHIPPING' ? '배송 중' :
                          status.name() == 'COMPLETED' ? '배송 완료' :
                          '주문 취소'}"
                    th:selected="${status == selectedStatus}">
            </option>
        </select>

        <input type="text"
               name="keyword"
               placeholder="주문번호 입력"
               th:value="${keyword}"
               style="padding: 10px; width: 220px;">

        <button type="submit" style="padding: 10px 18px;">
            검색
        </button>

        <a th:href="@{/admin/orders}"
           style="margin-left: 8px;">
            초기화
        </a>

    </form>

    <!-- 주문 목록 -->
    <table class="order-table" th:if="${not #lists.isEmpty(orders)}">
        <thead>
        <tr>
            <th>주문번호</th>
            <th>주문자</th>
            <th>받는 사람</th>
            <th>주문일</th>
            <th>결제 금액</th>
            <th>주문 상태</th>
            <th>관리</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="order : ${orders}">

            <td th:text="${order.orderNumber}"></td>
            <td th:text="${order.memberName}"></td>
            <td th:text="${order.recipient}"></td>

            <td th:text="${#temporals.format(order.orderedAt, 'yyyy-MM-dd HH:mm')}"></td>

            <td th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + '원'"></td>

            <td>
                <span class="order-status"
                      th:classappend="${order.orderStatus.name() == 'ORDERED' ? ' ordered' :
                                       order.orderStatus.name() == 'PREPARING' ? ' preparing' :
                                       order.orderStatus.name() == 'SHIPPING' ? ' shipping' :
                                       order.orderStatus.name() == 'COMPLETED' ? ' completed' :
                                       order.orderStatus.name() == 'CANCELLED' ? ' cancelled' : ''}"
                      th:text="${order.orderStatus.name() == 'ORDERED' ? '주문 접수' :
                                order.orderStatus.name() == 'PREPARING' ? '상품 준비 중' :
                                order.orderStatus.name() == 'SHIPPING' ? '배송 중' :
                                order.orderStatus.name() == 'COMPLETED' ? '배송 완료' :
                                order.orderStatus.name() == 'CANCELLED' ? '주문 취소' : '확인 필요'}">
                </span>
            </td>

            <td>
                <a th:href="@{/admin/orders/{id}(id=${order.orderId})}">
                    상세보기
                </a>
            </td>

        </tr>
        </tbody>
    </table>

    <div class="empty-message" th:if="${#lists.isEmpty(orders)}">
        아직 주문 내역이 없습니다.
    </div>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
