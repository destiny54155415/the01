<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop | 관리자 회원 목록</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>

<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="page-container">

    <div class="section">
        <h2 class="section-title">회원 관리</h2>
        <p class="text-muted" style="margin-bottom: 25px;">가입된 회원 목록을 조회하고 관리할 수 있습니다.</p>

        <table class="table">
            <thead>
            <tr>
                <th>회원번호</th>
                <th>아이디</th>
                <th>이름</th>
                <th>이메일</th>
                <th>전화번호</th>
                <th>권한</th>
                <th>관리</th>
            </tr>
            </thead>
            <tbody>
            <!-- 타임리프 반복문 -->
            <tr th:each="member : ${members}">
                <td th:text="${member.id}">1</td>
                <td th:text="${member.username}">user123</td>
                <td th:text="${member.name}">홍길동</td>
                <td th:text="${member.email}">user@test.com</td>
                <td th:text="${member.phone}">010-1234-5678</td>
                <td>
                    <!-- 권한에 따라 글자색 다르게 포인트 주기 -->
                    <span th:text="${member.role}"
                          th:style="${member.role == 'ADMIN'} ? 'color: #2563eb; font-weight: 700;' : 'color: #333;'">
                        USER
                    </span>
                </td>
                <td>
                    <!-- 추후 강제 탈퇴나 상세 보기 기능 연결용 버튼 (공용 버튼 스타일 활용) -->
                    <a href="#" class="btn btn-outline" style="padding: 5px 12px; font-size: 13px;">상세</a>
                </td>
            </tr>

            <!-- 회원이 없을 경우 예외 처리 -->
            <tr th:if="${#lists.isEmpty(members)}">
                <td colspan="7" style="padding: 40px 0; color: #777;">등록된 회원이 없습니다.</td>
            </tr>
            </tbody>
        </table>

        <!-- 하단 버튼 영역 -->
        <div style="margin-top: 30px; display: flex; justify-content: flex-end;">
            <a th:href="@{/}" class="btn btn-secondary">메인으로 돌아가기</a>
        </div>

    </div>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
