
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 리뷰 관리 | PetShop</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">

    <style>
        .admin-container {
            width: 1100px;
            max-width: 95%;
            margin: 50px auto;
        }

        .admin-title {
            margin-bottom: 30px;
        }

        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-form input {
            width: 300px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .search-form button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        .review-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        .review-table th,
        .review-table td {
            padding: 14px 10px;
            border-bottom: 1px solid #ddd;
        }

        .review-table th {
            background: #f5f5f5;
        }

        .review-content {
            max-width: 350px;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .delete-btn {
            padding: 7px 12px;
            border: none;
            border-radius: 4px;
            background: #dc3545;
            color: white;
            cursor: pointer;
        }

        .message {
            margin-bottom: 15px;
            color: #198754;
        }

        .error-message {
            margin-bottom: 15px;
            color: #dc3545;
        }

        @media (max-width: 750px) {
            .admin-container {
                overflow-x: auto;
            }

            .review-table {
                min-width: 850px;
            }
        }
    </style>
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>
<nav th:replace="~{fragments/category-nav :: categoryNav}"></nav>

<main class="admin-container">

    <h2 class="admin-title">관리자 리뷰 관리</h2>

    <p class="message"
       th:if="${message != null}"
       th:text="${message}"></p>

    <p class="error-message"
       th:if="${errorMessage != null}"
       th:text="${errorMessage}"></p>

    <!-- 리뷰 검색 -->
    <form class="search-form" th:action="@{/admin/reviews}" method="get">
        <input type="text"
               name="keyword"
               placeholder="리뷰 내용 검색"
               th:value="${keyword}">

        <button type="submit">검색</button>
    </form>

    <!-- 리뷰 목록 -->
    <table class="review-table">
        <thead>
        <tr>
            <th>번호</th>
            <th>회원명</th>
            <th>상품명</th>
            <th>별점</th>
            <th>리뷰 내용</th>
            <th>작성일</th>
            <th>관리</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="review : ${reviews}">
            <td th:text="${review.reviewId}"></td>
            <td th:text="${review.memberName}"></td>
            <td th:text="${review.productName}"></td>
            <td>
                <span th:text="${review.rating}"></span> / 5
            </td>
            <td class="review-content"
                th:text="${review.content}"></td>
            <td th:text="${#temporals.format(review.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td>
                <form th:action="@{/admin/reviews/{id}/delete(id=${review.reviewId})}"
                      method="post"
                      onsubmit="return confirm('정말 이 리뷰를 삭제하시겠습니까?');">

                    <button type="submit" class="delete-btn">
                        삭제
                    </button>
                </form>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(reviews)}">
            <td colspan="7">등록된 리뷰가 없습니다.</td>
        </tr>
        </tbody>
    </table>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
