<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반려동물 등록 | Shopping_Project</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<nav th:replace="~{fragments/category-nav :: categoryNav}"></nav>

<main class="page-container narrow">
    <h1 class="section-title">반려동물 등록</h1>

    <form class="admin-form" th:action="@{/mypage/pets}" th:object="${petForm}" method="post">
        <div class="form-group">
            <label class="form-label">동물 종류</label>
            <label><input type="radio" th:field="*{petType}" value="DOG"> 강아지</label>
            <label><input type="radio" th:field="*{petType}" value="CAT"> 고양이</label>
        </div>
        <div class="form-group">
            <label class="form-label" for="name">이름</label>
            <input id="name" class="form-control" th:field="*{name}" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="breed">견종 / 묘종</label>
            <input id="breed" class="form-control" th:field="*{breed}">
        </div>
        <div class="form-group">
            <label class="form-label" for="birthday">생일</label>
            <input id="birthday" type="date" class="form-control" th:field="*{birthday}">
        </div>
        <div class="form-group">
            <label class="form-label">성별</label>
            <label><input type="radio" th:field="*{gender}" value="MALE"> 남아</label>
            <label><input type="radio" th:field="*{gender}" value="FEMALE"> 여아</label>
        </div>
        <div class="form-group">
            <label class="form-label">중성화 여부</label>
            <label><input type="radio" th:field="*{neutered}" value="true"> 예</label>
            <label><input type="radio" th:field="*{neutered}" value="false"> 아니오</label>
        </div>
        <div class="form-group">
            <label class="form-label" for="weight">몸무게 (kg)</label>
            <input id="weight" type="number" step="0.1" min="0" class="form-control" th:field="*{weight}">
        </div>

        <div class="form-group">
            <label class="form-label">알러지 성분 선택 (복수 선택 가능)</label>
            <p class="text-muted">선택한 성분이 포함된 상품은 장바구니에서 기본으로 숨겨집니다.</p>
            <div class="category-chip-list">
                <label class="category-chip" th:each="item : ${allergyIngredients}">
                    <input type="checkbox" th:field="*{allergies}" th:value="${item.label}">
                    <span th:text="${item.label}">닭고기</span>
                </label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">등록 완료</button>
        <a class="btn btn-outline" th:href="@{/mypage/pets}">취소</a>
    </form>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
