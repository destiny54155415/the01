<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 반려동물 | Shopping_Project</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<nav th:replace="~{fragments/category-nav :: categoryNav}"></nav>

<main class="page-container">
    <div class="product-list-head">
        <h1 class="section-title">나의 반려동물</h1>
        <a class="btn btn-primary" th:href="@{/mypage/pets/new}">반려동물 등록</a>
    </div>

    <div class="empty-state" th:if="${pets == null or #lists.isEmpty(pets)}">
        <p>등록된 반려동물이 없습니다.</p>
    </div>

    <ul th:if="${pets != null and !#lists.isEmpty(pets)}">
        <li th:each="pet : ${pets}">
            <strong th:text="${pet.name}">이름</strong>
            <span th:text="${pet.petType}">DOG</span>
            <span class="text-muted"
                  th:if="${pet.allergies != null and !#strings.isEmpty(pet.allergies)}"
                  th:text="'알러지: ' + ${pet.allergies}">알러지</span>
        </li>
    </ul>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
