<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop | 내 반려동물</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>

<body>

<!-- 공통 헤더 -->
<header th:replace="~{fragments/header :: header}"></header>

<!-- 메인 콘텐츠 -->
<main class="page-container">

    <!-- 회원 정보 조회 페이지와 완벽히 동일한 Flexbox 구조 적용 -->
    <div style="display: flex; max-width: 1200px; margin: 0 auto; gap: 30px; align-items: flex-start;">

        <!-- 왼쪽 공통 사이드바 -->
        <div th:replace="~{fragments/mypage-sidebar :: sidebar}"></div>

        <!-- 오른쪽 본문 영역 -->
        <div style="flex-grow: 1; background: #fff; padding: 40px; border: 1px solid #eee; border-radius: 8px;">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h1 class="section-title" style="font-size: 24px; margin: 0;">
                    내 반려동물 관리
                </h1>
                <!-- 반려동물 등록 폼 페이지로 이동하는 버튼 -->
                <a th:href="@{/mypage/pets/new}" class="btn btn-primary" style="padding: 10px 16px; font-size: 14px;">
                    반려동물 추가하기
                </a>
            </div>

            <p style="color: #777; font-size: 14px; margin-bottom: 25px;">
                등록된 반려동물 목록을 확인할 수 있습니다.
            </p>

            <!-- 반려동물 목록 테이블 -->
            <table class="table" style="font-size: 14px;">
                <thead>
                <tr>
                    <th>이름</th>
                    <th>종류</th>
                    <th>견종/묘종</th>
                    <th>성별</th>
                    <th>몸무게</th>
                </tr>
                </thead>
                <tbody>
                <!-- 등록된 펫이 없을 경우 -->
                <tr th:if="${#lists.isEmpty(pets)}">
                    <td colspan="5" style="padding: 40px; color: #777;">
                        등록된 반려동물이 없습니다. 반려동물을 추가해 보세요!
                    </td>
                </tr>
                <!-- 펫이 있을 경우 반복문 -->
                <tr th:each="pet : ${pets}">
                    <td th:text="${pet.name}" style="font-weight: 600;">이름</td>
                    <td th:text="${pet.petType}">종류</td>
                    <td th:text="${pet.breed}">품종</td>
                    <td th:text="${pet.gender}">성별</td>
                    <td th:text="${pet.weight} + 'kg'">몸무게</td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>

</main>

<!-- 공통 푸터 -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
