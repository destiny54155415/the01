<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop | 반려동물 쇼핑몰</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/product.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>
<nav th:replace="~{fragments/category-nav :: categoryNav}"></nav>

<main class="container page-container">

    <section class="section">
        <div class="main-banner">
            <div class="banner-content">
                <h1>우리 아이를 위한 특별한 쇼핑</h1>
                <p>사료부터 간식, 장난감까지 필요한 모든 것을 만나보세요.</p>
                <a th:href="@{/products}" class="btn btn-primary">상품 둘러보기</a>
            </div>
        </div>
    </section>

    <section class="section">
        <h2 class="section-title">오늘의 인기 상품</h2>
        <p class="text-muted">판매량 기준 베스트셀러입니다.</p>

        <p class="empty-state" th:if="${#lists.isEmpty(featuredProducts)}">
            아직 등록된 상품이 없습니다. 관리자 상품 등록 또는 샘플 데이터를 확인해 주세요.
        </p>

        <div class="product-grid" th:if="${!#lists.isEmpty(featuredProducts)}">
            <article class="product-card" th:each="product, stat : ${featuredProducts}" th:if="${stat.index < 4}">
                <a th:href="@{/products/{id}(id=${product.productId})}">
                    <div class="product-image product-image-placeholder"
                         th:classappend="'tone-' + (${product.category.categoryId} % 6)"
                         th:text="${product.petType.label}">고양이</div>
                    <div class="product-info">
                        <p class="product-category" th:text="${product.category.categoryName}">사료</p>
                        <h3 class="product-name" th:text="${product.productName}">상품명</h3>
                        <p class="product-price">
                            <span th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + '원'">0원</span>
                        </p>
                    </div>
                </a>
            </article>
        </div>

        <p style="margin-top: 16px;">
            <a class="btn btn-outline" th:href="@{/products}">전체 상품 보기</a>
        </p>
    </section>

    <section class="section">
        <h2 class="section-title">PetShop과 함께하는 즐거운 쇼핑</h2>
        <div class="shopping-info">
            <div>
                <h3>다양한 상품</h3>
                <p>반려동물에게 필요한 다양한 상품을 한곳에서!</p>
            </div>
            <div>
                <h3>간편한 주문</h3>
                <p>원하는 상품을 장바구니에 담고 편리하게 주문하세요.</p>
            </div>
            <div>
                <h3>상품 리뷰</h3>
                <p>다른 반려인들의 구매 후기도 확인해 보세요.</p>
            </div>
        </div>
    </section>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
