<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop | 상품평 수정</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">

    <style>
        .review-edit-container {
            max-width: 700px;
            margin: 60px auto;
            padding: 30px;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 10px;
        }

        .review-edit-container h2 {
            margin-bottom: 30px;
        }

        .review-product {
            padding: 15px;
            margin-bottom: 25px;
            background: #f8fafc;
            border-radius: 6px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .form-group textarea {
            min-height: 180px;
            resize: vertical;
        }

        .button-area {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .button-area button,
        .button-area a {
            padding: 11px 25px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .submit-btn {
            background: #2563eb;
            color: white;
        }

        .cancel-btn {
            background: #e5e7eb;
            color: #333;
        }
    </style>
</head>
<body>

<div class="review-edit-container">
    <h2>상품평 수정</h2>

    <div class="review-product">
        **상품명:** <span th:text="${review.productName}"></span>
    </div>

    <form th:action="@{/reviews/update/{reviewId}(reviewId=${review.reviewId})}"
          method="post">

        <input type="hidden" name="fromMypage" value="true">

        <div class="form-group">
            <label for="rating">별점</label>
            <select id="rating" name="rating" required>
                <option value="5" th:selected="${review.rating == 5}">★★★★★ (5점)</option>
                <option value="4" th:selected="${review.rating == 4}">★★★★☆ (4점)</option>
                <option value="3" th:selected="${review.rating == 3}">★★★☆☆ (3점)</option>
                <option value="2" th:selected="${review.rating == 2}">★★☆☆☆ (2점)</option>
                <option value="1" th:selected="${review.rating == 1}">★☆☆☆☆ (1점)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="content">상품평 내용</label>
            <textarea id="content"
                      name="content"
                      required
                      th:text="${review.content}"></textarea>
        </div>

        <div class="button-area">
            <button type="submit" class="submit-btn">수정 완료</button>
            <a th:href="@{/mypage/reviews}" class="cancel-btn">취소</a>
        </div>
    </form>
</div>

</body>
</html>
