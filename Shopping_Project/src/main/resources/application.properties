spring.application.name=Shopping_Project

# ==============================
# Server
# ==============================
server.port=8080

# ==============================
# MySQL Database (팀 공통) - 재시작해도 데이터 유지
# ==============================
# MySQL 서비스가 켜져 있어야 합니다. (H2 mem 프로필을 켜면 데이터가 사라집니다)
spring.datasource.url=jdbc:mysql://localhost:3306/petshop?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.auto-commit=true

# ==============================
# JPA - update 로 스키마만 맞추고 기존 데이터는 삭제하지 않음
# ==============================
# create / create-drop 으로 바꾸면 members 등 데이터가 초기화됩니다. 사용 금지.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# ==============================
# Logging
# ==============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.example.shopping_project=DEBUG
