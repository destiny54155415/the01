spring.application.name=Shopping_Project

# ==============================
# Server
# ==============================
server.port=8080

# ==============================
# Local DB (H2) - IntelliJ에서 MySQL 없이도 실행됩니다
# MySQL을 쓰려면 아래 H2 설정을 주석 처리하고 MySQL 설정을 켜세요
# ==============================
spring.datasource.url=jdbc:h2:mem:petshop;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================
# MySQL Database (나중에 연결할 때 사용)
# ==============================
# spring.datasource.url=jdbc:mysql://localhost:3306/petshop?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
# spring.datasource.username=root
# spring.datasource.password=1234
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# Logging
# ==============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.example.shopping_project=DEBUG
