<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>카테고리 관리</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header th:replace="~{fragments/shell :: header}"></header>
<main class="wrap">
    <div class="list-head">
        <h1>카테고리</h1>
        <a class="button" href="/admin/categories/new">추가</a>
    </div>
    <p class="note" th:if="${message}" th:text="${message}"></p>
    <p class="note error" th:if="${error}" th:text="${error}"></p>
    <div class="table-wrap">
        <table>
            <thead>
            <tr><th>이름</th><th>순서</th><th>표시</th><th></th></tr>
            </thead>
            <tbody>
            <th:block th:each="parent : ${categories}">
                <tr>
                    <td th:text="${parent.name}">사료</td>
                    <td th:text="${parent.sortOrder}">1</td>
                    <td th:text="${parent.visible} ? '표시' : '숨김'">표시</td>
                    <td class="actions">
                        <a th:href="@{/admin/categories/{id}/edit(id=${parent.id})}">수정</a>
                        <form th:action="@{/admin/categories/{id}/delete(id=${parent.id})}" method="post">
                            <button type="submit">삭제</button>
                        </form>
                    </td>
                </tr>
                <tr th:each="child : ${parent.children}">
                    <td class="child" th:text="${child.name}">건식</td>
                    <td th:text="${child.sortOrder}">1</td>
                    <td th:text="${child.visible} ? '표시' : '숨김'">표시</td>
                    <td class="actions">
                        <a th:href="@{/admin/categories/{id}/edit(id=${child.id})}">수정</a>
                        <form th:action="@{/admin/categories/{id}/delete(id=${child.id})}" method="post">
                            <button type="submit">삭제</button>
                        </form>
                    </td>
                </tr>
            </th:block>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
