<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>상품 관리</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header th:replace="~{fragments/shell :: header}"></header>
<main class="wrap">
    <div class="list-head">
        <h1>상품</h1>
        <a class="button" href="/admin/products/new">추가</a>
    </div>
    <p class="note" th:if="${message}" th:text="${message}"></p>
    <form class="filters" method="get" action="/admin/products">
        <input type="search" name="q" th:value="${q}" placeholder="상품, 브랜드 검색">
        <select name="categoryId">
            <option value="">전체 카테고리</option>
            <optgroup th:each="parent : ${categories}" th:label="${parent.name}">
                <option th:each="child : ${parent.children}" th:value="${child.id}" th:text="${child.name}"
                        th:selected="${categoryId == child.id}"></option>
            </optgroup>
        </select>
        <button type="submit">찾기</button>
        <a href="/admin/categories">카테고리 관리</a>
    </form>
    <div class="table-wrap">
        <table>
            <thead>
            <tr><th>상품</th><th>카테고리</th><th>가격</th><th>재고</th><th>상태</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="product : ${result.content}">
                <td>
                    <strong th:text="${product.name}">이름</strong>
                    <span th:text="${product.brand}">브랜드</span>
                </td>
                <td th:text="${product.category.name}">건식</td>
                <td th:text="${#numbers.formatInteger(product.sellingPrice, 0, 'COMMA')} + '원'">0원</td>
                <td th:text="${product.stock}">0</td>
                <td th:text="${product.status.label}">판매중</td>
                <td class="actions">
                    <a th:href="@{/admin/products/{id}/edit(id=${product.id})}">수정</a>
                    <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post">
                        <button type="submit">삭제</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <p class="empty" th:if="${result.totalElements == 0}">상품이 없습니다.</p>
    <nav class="pager" th:if="${result.totalPages > 1}">
        <a th:if="${result.hasPrevious()}" th:href="@{/admin/products(q=${q}, categoryId=${categoryId}, page=${result.number - 1})}">이전</a>
        <span th:text="|${result.number + 1} / ${result.totalPages}|">1 / 1</span>
        <a th:if="${result.hasNext()}" th:href="@{/admin/products(q=${q}, categoryId=${categoryId}, page=${result.number + 1})}">다음</a>
    </nav>
</main>
</body>
</html>
