<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>카테고리 편집</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header th:replace="~{fragments/shell :: header}"></header>
<main class="wrap narrow">
    <h1 th:text="${form.id == null} ? '카테고리 추가' : '카테고리 수정'">카테고리</h1>
    <form th:object="${form}" th:action="${form.id == null} ? @{/admin/categories} : @{/admin/categories/{id}(id=${form.id})}" method="post" class="form">
        <label>이름
            <input type="text" th:field="*{name}" required>
        </label>
        <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        <label>상위 카테고리
            <select th:field="*{parentId}">
                <option value="">없음. 최상위</option>
                <option th:each="parent : ${parents}" th:value="${parent.id}" th:text="${parent.name}">사료</option>
            </select>
        </label>
        <label>정렬 순서
            <input type="number" th:field="*{sortOrder}">
        </label>
        <label class="check">
            <input type="checkbox" th:field="*{visible}"> 목록에 표시
        </label>
        <p class="note error" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        <button class="button" type="submit">저장</button>
        <a href="/admin/categories">목록</a>
    </form>
</main>
</body>
</html>
