<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<header th:fragment="header" class="top">
    <div class="bar">
        <a class="logo" href="/products">냥마트</a>
        <form class="search" method="get" action="/products">
            <input type="search" name="q" th:value="${q}" placeholder="상품, 브랜드 검색" aria-label="상품 검색">
            <input type="hidden" name="categoryId" th:if="${categoryId != null}" th:value="${categoryId}">
            <button type="submit">검색</button>
        </form>
        <a class="admin-link" href="/admin/products">상품관리</a>
    </div>
</header>

<footer th:fragment="footer" class="foot">
    <p>2번 담당 화면입니다. 상품, 카테고리, 검색만 다룹니다.</p>
</footer>
</body>
</html>
