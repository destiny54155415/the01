<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${product.name}">상품</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header th:replace="~{fragments/shell :: header}"></header>
<main class="wrap detail">
    <p class="crumb">
        <a href="/products">전체</a>
        <a th:href="@{/products(categoryId=${product.category.parent.id})}" th:text="${product.category.parent.name}">사료</a>
        <a th:href="@{/products(categoryId=${product.category.id})}" th:text="${product.category.name}">건식</a>
    </p>
    <div th:class="|thumb large tone-${product.category.id % 6}|">
        <span th:if="${product.status.name() == 'SOLD_OUT'}" class="badge">품절</span>
        <strong th:text="${product.brand}">브랜드</strong>
    </div>
    <p class="brand" th:text="${product.brand}">브랜드</p>
    <h1 th:text="${product.name}">상품명</h1>
    <p class="summary" th:text="${product.summary}">설명</p>
    <p class="price large">
        <del th:if="${product.discountPercent() != null}" th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + '원'">10원</del>
        <b th:text="${#numbers.formatInteger(product.sellingPrice, 0, 'COMMA')} + '원'">9원</b>
        <em th:if="${product.discountPercent() != null}" th:text="|${product.discountPercent()}%|">10%</em>
    </p>
    <p class="meta" th:if="${product.reviewCount > 0}"
       th:text="|평균 ${#numbers.formatDecimal(product.averageRating, 1, 1)}점 · 후기 ${product.reviewCount}개|">평점</p>
    <dl class="facts">
        <div><dt>재고</dt><dd th:text="${product.stock + '개'}">0개</dd></div>
        <div><dt>상태</dt><dd th:text="${product.status.label}">판매중</dd></div>
        <div><dt>조회</dt><dd th:text="${product.viewCount}">0</dd></div>
    </dl>
    <p class="description" th:text="${product.description}">상세</p>
</main>
<footer th:replace="~{fragments/shell :: footer}"></footer>
</body>
</html>
