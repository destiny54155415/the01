<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{layout :: head('답변형 게시판')}"></head>
<body>
<header th:replace="~{layout :: header}"></header>
<main class="wrap">
    <p class="flash" th:if="${message}" th:text="${message}"></p>
    <h1>게시글</h1>
    <p class="empty" th:if="${#lists.isEmpty(posts)}">등록된 글이 없습니다.</p>
    <table th:unless="${#lists.isEmpty(posts)}">
        <thead>
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성자</th>
            <th>작성일</th>
            <th>조회</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="post : ${posts}">
            <td th:text="${post.id}">1</td>
            <td>
                <a th:href="@{/posts/{id}(id=${post.id})}"
                   th:style="|padding-left:${post.depth * 18}px|"
                   th:text="${post.depth > 0 ? '↳ ' + post.title : post.title}">제목</a>
            </td>
            <td th:text="${post.writer}">foxman12</td>
            <td th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd. HH:mm')}">2025.10.29. 16:25</td>
            <td th:text="${post.viewCount}">0</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
